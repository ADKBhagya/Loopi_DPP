name: Production Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            set -e

            cd /var/www/Loopi_DPP

            git reset --hard
            git clean -fd
            git pull origin main

            cd backend
            npm ci || npm install
            cd ../frontend
            rm -rf node_modules
            npm ci || npm install
            npm run build

            cd ../backend
            pm2 restart loopi-backend --update-env || pm2 start server.js --name loopi-backend
            pm2 save

            echo "Frontend build:"
            ls -la dist
            grep -o "assets/index-[^\"]*\.js" dist/index.html || true

            curl -fsS http://127.0.0.1:5000/ || true
